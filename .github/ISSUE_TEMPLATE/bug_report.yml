name: "🐛 Bug Report"
description: "File a bug report for an application issue, UI glitch, or API error"
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting a bug! Please fill out the sections below as accurately as possible to help us reproduce and resolve the issue.

  - type: textarea
    id: description
    attributes:
      label: "Bug Description"
      description: "A clear and concise description of what the bug is."
      placeholder: "When clicking the category filter on mobile, the dropdown does not open..."
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: "Steps to Reproduce"
      description: "Step-by-step instructions to reproduce the problem."
      placeholder: |
        1. Go to '...'
        2. Click on '....'
        3. Scroll down to '....'
        4. See error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: "Expected Behavior"
      description: "A clear and concise description of what you expected to happen."
      placeholder: "The dropdown menu should open smoothly without clipping..."
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: "Actual Behavior"
      description: "What actually occurred when the bug happened."
      placeholder: "Nothing happens and a JavaScript error is logged in the console..."
    validations:
      required: false

  - type: textarea
    id: screenshots
    attributes:
      label: "Screenshots / Screen Recording"
      description: "Drag and drop any images or videos showing the bug."
      placeholder: "Paste or drop screenshots here..."
    validations:
      required: false

  - type: dropdown
    id: area
    attributes:
      label: "Affected Area"
      description: "Which part of Portalix is affected?"
      options:
        - "Frontend UI / Theme (Dark/Light mode)"
        - "Search / Filter functionality"
        - "Bookmarking / Local Storage"
        - "Backend / Express Server"
        - "REST API (/api/sites, /health, /api/info)"
        - "Build / Tooling / TypeScript"
        - "Other"
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: "Environment"
      description: "Device, OS, and browser information where the issue occurred."
      placeholder: "e.g., Windows 11, Chrome 124 / macOS Sonoma, Safari 17 / Node.js v20.x"
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: "Console Logs / Terminal Output"
      description: "Please include any browser console errors or terminal logs."
      render: shell
    validations:
      required: false

  - type: checkboxes
    id: checklist
    attributes:
      label: "Checklist"
      options:
        - label: "I have searched the [existing issues](https://github.com/ichshakib/portalix/issues) and confirmed this bug has not already been reported."
          required: true
        - label: "I am using the latest version of the application."
          required: false
